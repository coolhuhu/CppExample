[project]
name = "pymodule"
dynamic = ["version"]
requires-python = ">= 3.8"
authors = [
  {name = "Hu Liang", email = "coolhuhu@foxmail.com"}
]
description = "use setuptools to build pybind11-example"
readme = {file = "README.md", content-type = "text/markdown"}

# dependencies = []

[build-system]
requires = ["setuptools >= 64.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pymodule"]
package-dir = { pymodule = "python/pymodule" }